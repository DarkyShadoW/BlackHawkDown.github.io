<!-- Lo que se superpone en el vuelo de Irene y en las cinemáticas, el chat de radio y el panel del mapa táctico. -->
<button id="bSkip" hidden>Saltar vuelo</button>
<div id="chat" class="empty" aria-live="polite"><button id="chatHead" aria-expanded="false" title="Ver toda la radio"><span>Radio</span><i class="chev" aria-hidden="true"></i></button><div id="chatLive"></div><div id="chatHist" hidden></div></div>
<div id="flyUnits" aria-label="Unidades en vuelo"></div>
<div id="flyCam"><button id="fZin" title="Acercar" aria-label="Acercar">+</button><button id="fZout" title="Alejar" aria-label="Alejar">&minus;</button><button id="fRotL" title="Girar cámara (Q)" aria-label="Girar cámara a la izquierda">&#10226;</button><button id="fRotR" title="Girar cámara (E)" aria-label="Girar cámara a la derecha">&#10227;</button></div>
<div id="cine" hidden></div>
<div id="mapPanel" hidden>
  <div class="mp-head"><b>Mapa táctico</b>
    <div class="mp-tabs" role="group" aria-label="Escala"><button id="mpCity" aria-pressed="true">Ciudad</button><button id="mpReg" aria-pressed="false">Región</button></div>
    <button id="mpPause" aria-pressed="false">Pausa</button><button id="mpClose">Cerrar</button></div>
  <div class="mp-view"><canvas id="mpCanvas"></canvas>
    <div class="mp-ctl"><button id="mpZin" aria-label="Acercar">+</button><button id="mpZout" aria-label="Alejar">&minus;</button><button id="mpCentre" title="Centrar en mis unidades" aria-label="Centrar en mis unidades">&#8982;</button><button id="mpAll" title="Ver el plano entero" aria-label="Ver el plano entero">&#9635;</button></div>
    <div id="mpLoading" class="mp-loading" hidden>Desplegando el plano…</div></div>
  <span class="mp-hint">Arrastra para moverte · pellizca o usa la rueda para ampliar · toca un punto para llevar la cámara allí</span>
</div>
